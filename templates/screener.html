<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多因子评分 - 量化平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#0D1117;color:#F0F6FC;display:flex;min-height:100vh}
.sidebar{width:200px;background:#111419;padding:20px 0;border-right:1px solid #30363D;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar .logo{font-size:16px;font-weight:bold;color:#58A6FF;padding:0 20px 20px;border-bottom:1px solid #30363D;margin-bottom:10px}
.sidebar a{display:block;color:#8B949E;padding:10px 20px;text-decoration:none;font-size:14px;transition:.2s;border-left:3px solid transparent}
.sidebar a:hover,.sidebar a.active{color:#F0F6FC;background:rgba(88,166,255,0.08);border-left-color:#58A6FF}
.main{margin-left:200px;flex:1;padding:20px}
.card{background:#161B22;border:1px solid #30363D;border-radius:8px;padding:15px;margin-bottom:15px}
.card h3{font-size:13px;color:#8B949E;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:#8B949E;font-weight:normal;border-bottom:1px solid #30363D;font-size:11px}
td{padding:6px 10px;border-bottom:1px solid #1A1E25}
tr:hover td{background:rgba(88,166,255,0.03)}
.green{color:#3FB950}.red{color:#F85149}.blue{color:#58A6FF}.gold{color:#D29922}.purple{color:#BC8CFF}.gray{color:#8B949E}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:bold}
.badge-buy{background:rgba(63,185,80,0.2);color:#3FB950}
.badge-hold{background:rgba(88,166,255,0.2);color:#58A6FF}
.badge-sell{background:rgba(248,81,73,0.2);color:#F85149}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold}
.btn-blue{background:#58A6FF;color:#fff;margin-right:10px}
.btn-blue:hover{background:#79B8FF}
input,select{background:#0D1117;border:1px solid #30363D;border-radius:6px;color:#F0F6FC;padding:8px 12px;font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}
.kpi{text-align:center;padding:10px}
.kpi .val{font-size:24px;font-weight:bold}.kpi .lbl{font-size:11px;color:#8B949E;margin-top:4px}
.chart-box{height:300px}
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="sidebar">
    <div class="logo">量化交易平台</div>
    <a href="/">概览看板</a>
    <a href="/screener" class="active">多因子评分</a>
    <a href="/portfolio">组合优化</a>
    <a href="/backtest">策略回测</a>
    <a href="/report">分析报告</a>
</div>
<div class="main">
    <div class="top-bar">
        <input type="text" id="codeInput" placeholder="输入品种代码,逗号分隔 (留空=全市场)" style="width:400px" />
        <button class="btn btn-blue" onclick="runScore()">开始评分</button>
        <span class="gray" style="font-size:12px" id="status"></span>
    </div>

    <div class="grid4" id="summaryCards"></div>

    <div class="card">
        <h3>全品类评分排名 (9因子模型)</h3>
        <div id="scoreTable"><div style="text-align:center;padding:40px;color:#8B949E">点击"开始评分"载入数据</div></div>
    </div>

    <div class="card">
        <h3>评分分布</h3>
        <div class="chart-box" id="chartDist"></div>
    </div>
</div>

<script>
async function runScore() {
    document.getElementById('status').textContent = '评分中...';
    const codesStr = document.getElementById('codeInput').value.trim();
    const body = codesStr ? {codes: codesStr.split(/[,，\s]+/).filter(Boolean), top_n: 50} : {top_n: 100};

    const resp = await fetch('/api/score_batch', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    const data = await resp.json();
    if (!data || !data.data) { document.getElementById('status').textContent = '失败'; return; }

    const s = data.summary;
    document.getElementById('summaryCards').innerHTML = `
        <div class="card kpi"><div class="lbl">评分品种</div><div class="val blue">${s.total}</div></div>
        <div class="card kpi"><div class="lbl">平均评分</div><div class="val blue">${s.avg_score}</div></div>
        <div class="card kpi"><div class="lbl">买入信号</div><div class="val green">${s.buy}</div></div>
        <div class="card kpi"><div class="lbl">卖出信号</div><div class="val red">${s.sell}</div></div>
    `;

    let html = '<table><tr><th>排名</th><th>代码</th><th>名称</th><th>总分</th><th>等级</th><th>位置</th><th>动能</th><th>趋势</th><th>质量</th><th>成长</th><th>RSI</th><th>信号</th></tr>';
    data.data.forEach((r,i) => {
        const bc = r.signal==='强买'||r.signal==='买入'?'badge-buy':(r.signal==='减仓'||r.signal==='回避'?'badge-sell':'badge-hold');
        const gc = r.grade&&r.grade[0]==='A'?'badge-buy':(r.grade&&r.grade[0]==='D'?'badge-sell':'badge-hold');
        html += `<tr>
            <td>${i+1}</td><td>${r.code}</td><td>${r.name||''}</td>
            <td class="blue" style="font-weight:bold">${r.total}</td>
            <td><span class="badge ${gc}">${r.grade}</span></td>
            <td>${r.position||'--'}</td><td>${r.momentum||'--'}</td><td>${r.trend||'--'}</td>
            <td>${r.quality||'--'}</td><td>${r.growth||'--'}</td><td>${r.rsi||'--'}</td>
            <td><span class="badge ${bc}">${r.signal}</span></td>
        </tr>`;
    });
    html += '</table>';
    document.getElementById('scoreTable').innerHTML = html;

    // Distribution chart
    const dist = {A:0,B:0,C:0,D:0};
    data.data.forEach(x => { const g = x.grade||'D'; dist[g[0]] = (dist[g[0]]||0)+1; });
    const dom = document.getElementById('chartDist');
    if (dom) {
        const chart = echarts.init(dom);
        chart.setOption({
            tooltip:{trigger:'axis'},
            xAxis:{type:'category',data:['A(85+)','B(70-84)','C(60-69)','D(<60)'],axisLabel:{color:'#8B949E'}},
            yAxis:{type:'value',axisLabel:{color:'#8B949E'}},
            series:[{type:'bar',data:[
                {value:dist.A,itemStyle:{color:'#3FB950'}},
                {value:dist.B,itemStyle:{color:'#58A6FF'}},
                {value:dist.C,itemStyle:{color:'#D29922'}},
                {value:dist.D,itemStyle:{color:'#F85149'}},
            ],barWidth:'60%'}]
        });
    }

    document.getElementById('status').textContent = '完成 - ' + new Date().toLocaleTimeString();
}
</script>
</body>
</html>
