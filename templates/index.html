<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化交易平台 v3.0</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#0D1117;color:#F0F6FC;display:flex;min-height:100vh}
.sidebar{width:200px;background:#111419;padding:20px 0;border-right:1px solid #30363D;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar .logo{font-size:16px;font-weight:bold;color:#58A6FF;padding:0 20px 20px;border-bottom:1px solid #30363D;margin-bottom:10px}
.sidebar a{display:block;color:#8B949E;padding:10px 20px;text-decoration:none;font-size:14px;transition:.2s;border-left:3px solid transparent}
.sidebar a:hover,.sidebar a.active{color:#F0F6FC;background:rgba(88,166,255,0.08);border-left-color:#58A6FF}
.main{margin-left:200px;flex:1;padding:20px}
.header{background:#161B22;padding:12px 20px;border-radius:8px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;border:1px solid #30363D}
.header h1{font-size:18px;color:#58A6FF}
.header .status{font-size:12px;color:#3FB950}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#161B22;border:1px solid #30363D;border-radius:8px;padding:15px}
.card h3{font-size:13px;color:#8B949E;margin-bottom:10px;font-weight:normal}
.card .value{font-size:28px;font-weight:bold}
.card .sub{font-size:11px;color:#484F58;margin-top:4px}
.chart-box{height:350px}
.chart-box-wide{height:300px}
.chart-box-tall{height:400px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:#8B949E;font-weight:normal;border-bottom:1px solid #30363D;font-size:11px}
td{padding:6px 10px;border-bottom:1px solid #1A1E25}
tr:hover td{background:rgba(88,166,255,0.03)}
.green{color:#3FB950}
.red{color:#F85149}
.blue{color:#58A6FF}
.gold{color:#D29922}
.purple{color:#BC8CFF}
.gray{color:#8B949E}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:bold}
.badge-buy{background:rgba(63,185,80,0.2);color:#3FB950}
.badge-hold{background:rgba(88,166,255,0.2);color:#58A6FF}
.badge-sell{background:rgba(248,81,73,0.2);color:#F85149}
.badge-warn{background:rgba(210,153,34,0.2);color:#D29922}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;transition:.2s}
.btn-blue{background:#58A6FF;color:#fff}
.btn-blue:hover{background:#79B8FF}
.btn-green{background:#238636;color:#fff}
.btn-outline{background:transparent;border:1px solid #30363D;color:#8B949E}
.btn-outline:hover{color:#F0F6FC;border-color:#58A6FF}
input,select{padding:8px 12px;background:#0D1117;border:1px solid #30363D;border-radius:6px;color:#F0F6FC;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#58A6FF}
.loading{text-align:center;padding:40px;color:#8B949E}
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.flex{display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<div class="sidebar">
    <div class="logo">量化交易平台</div>
    <a href="/" class="active">概览看板</a>
    <a href="/screener">多因子评分</a>
    <a href="/portfolio">组合优化</a>
    <a href="/backtest">策略回测</a>
    <a href="/report">分析报告</a>
</div>
<div class="main">
    <div class="header">
        <div class="flex">
            <h1>概览看板</h1>
            <span class="status" id="status">● 实时</span>
        </div>
        <div class="flex">
            <button class="btn btn-outline btn-sm" onclick="refreshAll()">刷新数据</button>
            <span class="gray" style="font-size:12px" id="updateTime"></span>
        </div>
    </div>

    <!-- KPI Row -->
    <div class="grid4" id="kpiRow" style="margin-bottom:15px">
        <div class="card"><h3>综合评分</h3><div class="value blue" id="kpi_avg">--</div><div class="sub">平均分</div></div>
        <div class="card"><h3>多头信号</h3><div class="value green" id="kpi_buy">--</div><div class="sub">买入+持有</div></div>
        <div class="card"><h3>空头信号</h3><div class="value red" id="kpi_sell">--</div><div class="sub">减仓+回避</div></div>
        <div class="card"><h3>风险等级</h3><div class="value gold" id="kpi_risk">--</div><div class="sub">自动判定</div></div>
    </div>

    <!-- Market overview + Score distribution -->
    <div class="grid2" style="margin-bottom:15px">
        <div class="card">
            <h3>市场概况</h3>
            <div class="grid3" style="margin-bottom:10px">
                <div><span class="gray" style="font-size:11px">上涨</span><br><span class="green" style="font-size:20px;font-weight:bold" id="mkt_up">--</span></div>
                <div><span class="gray" style="font-size:11px">下跌</span><br><span class="red" style="font-size:20px;font-weight:bold" id="mkt_down">--</span></div>
                <div><span class="gray" style="font-size:11px">平均涨跌</span><br><span style="font-size:20px;font-weight:bold" id="mkt_avg">--</span></div>
            </div>
            <div class="chart-box" id="chartMarket"></div>
        </div>
        <div class="card">
            <h3>评分分布</h3>
            <div class="chart-box" id="chartScore"></div>
        </div>
    </div>

    <!-- Top scored stocks -->
    <div class="card">
        <h3>高分品种 Top 15</h3>
        <div id="topTable"><div class="loading">加载中...</div></div>
    </div>
</div>

<script>
const API = '/api';

async function fetchJSON(url, opts={}) {
    try {
        const r = await fetch(url, opts);
        return await r.json();
    } catch(e) {
        return null;
    }
}

async function refreshAll() {
    document.getElementById('updateTime').textContent = '更新中...';

    // Load spot data
    const spotData = await fetchJSON(API + '/spot');
    if (spotData && spotData.data) {
        const d = spotData.data;
        const up = d.filter(x => x.pct_chg > 0).length;
        const down = d.filter(x => x.pct_chg < 0).length;
        const avg = (d.reduce((s,x) => s + (x.pct_chg||0), 0) / d.length).toFixed(2);
        document.getElementById('mkt_up').textContent = up;
        document.getElementById('mkt_down').textContent = down;
        document.getElementById('mkt_avg').textContent = avg + '%';
        document.getElementById('mkt_avg').className = avg >= 0 ? 'green' : 'red';
        document.getElementById('mkt_avg').style.cssText = 'font-size:20px;font-weight:bold';
        // Market pie chart
        const pieDom = document.getElementById('chartMarket');
        if (pieDom) {
            const chart = echarts.init(pieDom);
            chart.setOption({
                tooltip: {trigger:'item'},
                series: [{
                    type:'pie', radius:['50%','75%'],
                    itemStyle: {borderColor:'#161B22',borderWidth:2},
                    label:{color:'#8B949E',fontSize:11},
                    data: [
                        {value:up, name:'上涨', itemStyle:{color:'#3FB950'}},
                        {value:down, name:'下跌', itemStyle:{color:'#F85149'}},
                        {value:d.length-up-down, name:'平盘', itemStyle:{color:'#484F58'}},
                    ]
                }]
            });
        }
        document.getElementById('updateTime').textContent = spotData.time || '';
    }

    // Load batch scores
    const scoreData = await fetchJSON(API + '/score_batch', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({top_n:100})
    });
    if (scoreData && scoreData.data && scoreData.data.length > 0) {
        const s = scoreData.summary;
        document.getElementById('kpi_avg').textContent = s.avg_score || '--';
        document.getElementById('kpi_buy').textContent = s.buy || '--';
        document.getElementById('kpi_sell').textContent = s.sell || '--';
        document.getElementById('kpi_risk').textContent = s.avg_score >= 75 ? '低' : (s.avg_score >= 65 ? '中等' : '偏高');

        // Score distribution chart
        const dist = {A:0,B:0,C:0,D:0};
        scoreData.data.forEach(x => { const g = x.grade || 'D'; dist[g[0]] = (dist[g[0]]||0)+1; });
        const barDom = document.getElementById('chartScore');
        if (barDom) {
            const chart = echarts.init(barDom);
            chart.setOption({
                tooltip:{trigger:'axis'},
                xAxis:{type:'category',data:['A','B','C','D'],axisLabel:{color:'#8B949E'}},
                yAxis:{type:'value',axisLabel:{color:'#8B949E'}},
                series:[{type:'bar',data:[
                    {value:dist.A, itemStyle:{color:'#3FB950'}},
                    {value:dist.B, itemStyle:{color:'#58A6FF'}},
                    {value:dist.C, itemStyle:{color:'#D29922'}},
                    {value:dist.D, itemStyle:{color:'#F85149'}},
                ],barWidth:'60%'}]
            });
        }

        // Top table
        let html = '<table><tr><th>排名</th><th>代码</th><th>名称</th><th>评分</th><th>等级</th><th>位置</th><th>动能</th><th>趋势</th><th>信号</th></tr>';
        scoreData.data.slice(0,15).forEach((r,i) => {
            const badge = r.signal === '强买' || r.signal === '买入' ? 'badge-buy' :
                          (r.signal === '减仓' || r.signal === '回避' ? 'badge-sell' : 'badge-hold');
            html += `<tr>
                <td>${i+1}</td><td>${r.code}</td><td>${r.name||''}</td>
                <td class="blue" style="font-weight:bold">${r.total}</td>
                <td><span class="badge badge-${r.grade&&r.grade[0]==='A'?'buy':(r.grade&&r.grade[0]==='D'?'sell':'hold')}">${r.grade}</span></td>
                <td>${r.position||'--'}</td><td>${r.momentum||'--'}</td><td>${r.trend||'--'}</td>
                <td><span class="badge ${badge}">${r.signal}</span></td>
            </tr>`;
        });
        html += '</table>';
        document.getElementById('topTable').innerHTML = html;

        document.getElementById('status').textContent = '● 实时';
    } else {
        document.getElementById('topTable').innerHTML = '<div class="loading">评分数据加载中...请稍候再试 (首次启动需要获取行情数据)</div>';
        document.getElementById('status').textContent = '● 预热中';
    }
}

refreshAll();
setInterval(refreshAll, 60000); // 每分钟刷新
</script>
</body>
</html>
