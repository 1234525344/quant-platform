<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>策略回测</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#0D1117;color:#F0F6FC;display:flex;min-height:100vh}
.sidebar{width:200px;background:#111419;padding:20px 0;border-right:1px solid #30363D;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar .logo{font-size:16px;font-weight:bold;color:#58A6FF;padding:0 20px 20px;border-bottom:1px solid #30363D;margin-bottom:10px}
.sidebar a{display:block;color:#8B949E;padding:10px 20px;text-decoration:none;font-size:14px;transition:.2s;border-left:3px solid transparent}
.sidebar a:hover,.sidebar a.active{color:#F0F6FC;background:rgba(88,166,255,0.08);border-left-color:#58A6FF}
.main{margin-left:200px;flex:1;padding:20px}
.card{background:#161B22;border:1px solid #30363D;border-radius:8px;padding:15px;margin-bottom:15px}
.card h3{font-size:13px;color:#8B949E;margin-bottom:10px}
.green{color:#3FB950}.red{color:#F85149}.blue{color:#58A6FF}.gold{color:#D29922}.purple{color:#BC8CFF}.gray{color:#8B949E}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold}
.btn-blue{background:#58A6FF;color:#fff}
input,select{background:#0D1117;border:1px solid #30363D;border-radius:6px;color:#F0F6FC;padding:8px 12px;font-size:13px}
.chart-box{height:350px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:15px}
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="sidebar">
    <div class="logo">量化交易平台</div>
    <a href="/">概览看板</a><a href="/screener">多因子评分</a>
    <a href="/portfolio">组合优化</a><a href="/backtest" class="active">策略回测</a><a href="/report">分析报告</a>
</div>
<div class="main">
    <div class="top-bar">
        <input type="text" id="btCodes" placeholder="标的池 (逗号分隔)" value="600519,000858,300750" style="width:350px" />
        <select id="btFreq"><option value="monthly">月度调仓</option><option value="weekly">周度调仓</option></select>
        <input type="number" id="btTopN" value="5" style="width:70px" placeholder="持仓数" />
        <button class="btn btn-blue" onclick="runBT()">运行回测</button>
        <span class="gray" style="font-size:12px" id="status"></span>
    </div>
    <div class="grid5" id="btStats"></div>
    <div class="card"><h3>净值曲线</h3><div class="chart-box" id="btChart"></div></div>
</div>
<script>
async function runBT() {
    document.getElementById('status').textContent = '回测中...';
    const codes = document.getElementById('btCodes').value.split(/[,，\s]+/).filter(Boolean);
    const resp = await fetch('/api/backtest', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({codes, rebalance_freq:document.getElementById('btFreq').value, top_n:parseInt(document.getElementById('btTopN').value), init_cash:1000000})
    });
    const r = await resp.json();
    if (!r || !r.value_curve || r.value_curve.length===0) { document.getElementById('status').textContent = '数据不足'; return; }

    document.getElementById('btStats').innerHTML = `
        <div class="card"><h3>累计收益</h3><div class="value green">${r.total_return}%</div></div>
        <div class="card"><h3>最大回撤</h3><div class="value red">${r.max_drawdown}%</div></div>
        <div class="card"><h3>夏普比率</h3><div class="value blue">${r.sharpe}</div></div>
        <div class="card"><h3>交易次数</h3><div class="value purple">${r.trades}</div></div>
        <div class="card"><h3>调仓次数</h3><div class="value gold">${r.n_rebalances}</div></div>
    `;

    const dom = document.getElementById('btChart');
    if (dom && r.value_curve) {
        const chart = echarts.init(dom);
        chart.setOption({
            tooltip:{trigger:'axis'}, grid:{left:60,right:20,top:10,bottom:40},
            xAxis:{type:'category',data:r.value_curve.map(v=>v.date),axisLabel:{color:'#8B949E',rotate:45}},
            yAxis:{type:'value',axisLabel:{color:'#8B949E',formatter:v=>((v/10000).toFixed(0)+'万')}},
            series:[{type:'line',data:r.value_curve.map(v=>v.value),smooth:true,
                lineStyle:{color:'#58A6FF',width:2},areaStyle:{color:'rgba(88,166,255,0.1)'},
                symbol:'none'}]
        });
    }
    document.getElementById('status').textContent = '完成';
}
</script>
</body>
</html>
