<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>组合优化</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#0D1117;color:#F0F6FC;display:flex;min-height:100vh}
.sidebar{width:200px;background:#111419;padding:20px 0;border-right:1px solid #30363D;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar .logo{font-size:16px;font-weight:bold;color:#58A6FF;padding:0 20px 20px;border-bottom:1px solid #30363D;margin-bottom:10px}
.sidebar a{display:block;color:#8B949E;padding:10px 20px;text-decoration:none;font-size:14px;transition:.2s;border-left:3px solid transparent}
.sidebar a:hover,.sidebar a.active{color:#F0F6FC;background:rgba(88,166,255,0.08);border-left-color:#58A6FF}
.main{margin-left:200px;flex:1;padding:20px}
.card{background:#161B22;border:1px solid #30363D;border-radius:8px;padding:15px;margin-bottom:15px}
.card h3{font-size:13px;color:#8B949E;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:#8B949E;font-weight:normal;border-bottom:1px solid #30363D;font-size:11px}
td{padding:6px 10px;border-bottom:1px solid #1A1E25}
.green{color:#3FB950}.red{color:#F85149}.blue{color:#58A6FF}.gold{color:#D29922}.purple{color:#BC8CFF}.gray{color:#8B949E}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold}
.btn-blue{background:#58A6FF;color:#fff}
.btn-blue:hover{background:#79B8FF}
input,select{background:#0D1117;border:1px solid #30363D;border-radius:6px;color:#F0F6FC;padding:8px 12px;font-size:13px}
.chart-box{height:350px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="sidebar">
    <div class="logo">量化交易平台</div>
    <a href="/">概览看板</a><a href="/screener">多因子评分</a>
    <a href="/portfolio" class="active">组合优化</a><a href="/backtest">策略回测</a><a href="/report">分析报告</a>
</div>
<div class="main">
    <div class="top-bar">
        <input type="text" id="portCodes" placeholder="品种代码 (逗号分隔)" value="600519,000858,300750,601318,000001,002415,600276,601012" style="width:400px" />
        <select id="optMethod">
            <option value="maxSharpe">Max Sharpe</option>
            <option value="riskParity">Risk Parity</option>
            <option value="minVariance">Min Variance</option>
            <option value="equalWeight">Equal Weight</option>
        </select>
        <button class="btn btn-blue" onclick="runOptimize()">运行优化</button>
        <span class="gray" style="font-size:12px" id="status"></span>
    </div>

    <div class="grid4" id="stats" style="margin-bottom:15px"></div>

    <div class="grid2">
        <div class="card"><h3>最优权重</h3><div class="chart-box" id="chartPie"></div></div>
        <div class="card"><h3>组合明细</h3><div id="weightTable"></div></div>
    </div>
</div>

<script>
async function runOptimize() {
    document.getElementById('status').textContent = '优化中...';
    const codes = document.getElementById('portCodes').value.split(/[,，\s]+/).filter(Boolean);
    const method = document.getElementById('optMethod').value;
    const resp = await fetch('/api/optimize', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({codes, method})
    });
    const r = await resp.json();
    if (!r || !r.weights) { document.getElementById('status').textContent = '失败'; return; }

    document.getElementById('stats').innerHTML = `
        <div class="card"><h3>方法</h3><div class="value blue">${r.method}</div></div>
        <div class="card"><h3>预期收益</h3><div class="value green">${r.exp_return}%</div></div>
        <div class="card"><h3>预期波动</h3><div class="value gold">${r.exp_vol}%</div></div>
        <div class="card"><h3>夏普比率</h3><div class="value purple">${r.sharpe}</div></div>
    `;

    const pieDom = document.getElementById('chartPie');
    if (pieDom) {
        const chart = echarts.init(pieDom);
        const pieData = Object.entries(r.weights).map(([k,v]) => ({name:k,value:parseFloat((v*100).toFixed(1))}));
        chart.setOption({
            tooltip:{trigger:'item',formatter:'{b}: {c}%'},
            series:[{type:'pie',radius:['40%','70%'],data:pieData,
                label:{color:'#8B949E',formatter:'{b}\n{c}%'}}]
        });
    }

    let html = '<table><tr><th>代码</th><th>权重</th><th>占比</th></tr>';
    Object.entries(r.weights).sort((a,b)=>b[1]-a[1]).forEach(([k,v]) => {
        html += `<tr><td style="color:#58A6FF">${k}</td><td>${(v*100).toFixed(1)}%</td>
            <td><div style="background:#30363D;height:8px;border-radius:4px;width:200px">
            <div style="background:#58A6FF;height:8px;border-radius:4px;width:${v*200}px"></div></div></td></tr>`;
    });
    html += '</table>';
    document.getElementById('weightTable').innerHTML = html;
    document.getElementById('status').textContent = '完成';
}
</script>
</body>
</html>
